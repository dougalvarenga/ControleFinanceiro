<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Controle Financeiro
    </title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- FUNDO LIQUID GLASS -->

    <div class="liquid-background">

        <div class="orb orb-1"></div>

        <div class="orb orb-2"></div>

        <div class="orb orb-3"></div>

    </div>

    <!-- ========================= -->
    <!-- INÍCIO -->
    <!-- ========================= -->

    <section
        id="inicio"
        class="pagina ativa">

        <div class="container">

            <div class="saldo-card glass-card">

                <div class="topo-card">

                    <h3>Saldo</h3>

                    <button
                        class="btn-icon"
                        onclick="abrirTela('ajustes')">

                        <i class="bi bi-gear-fill"></i>

                    </button>

                </div>

                <h1 id="saldo">

                    R$ 0,00

                </h1>

                <div class="resumo">

                    <div class="card-resumo glass-card">

                        <span>
                            Entradas
                        </span>

                        <strong
                            id="totalEntradas"
                            class="texto-verde">

                            R$ 0,00

                        </strong>

                    </div>

                    <div class="card-resumo glass-card">

                        <span>
                            Saídas
                        </span>

                        <strong
                            id="totalSaidas"
                            class="texto-vermelho">

                            R$ 0,00

                        </strong>

                    </div>

                </div>

            </div>

            <div class="acoes">

                <button
                    id="btnEntrada"
                    class="entrada-btn">

                    <i class="bi bi-plus-circle-fill"></i>

                    Entrada

                </button>

                <button
                    id="btnSaida"
                    class="saida-btn">

                    <i class="bi bi-dash-circle-fill"></i>

                    Saída

                </button>

            </div>

            <div class="bloco">

                <div class="secao-titulo">

                    <h2>
                        Últimos 10 Lançamentos
                    </h2>

                </div>

                <div id="ultimosLancamentos">

                </div>

            </div>

        </div>

    </section>

    <!-- ========================= -->
    <!-- MOVIMENTAÇÕES -->
    <!-- ========================= -->

    <section
        id="movimentacoes"
        class="pagina">

        <div class="container">

            <h2
                class="titulo-pagina">

                Movimentações

            </h2>

            <div class="glass-card filtros">

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="🔍 Pesquisar movimentações">

                <select
                    id="filtroCategoria">

                    <option value="">
                        Todas as Categorias
                    </option>

                </select>

                <select
                    id="ordenacao">

                    <option value="recentes">
                        Mais recentes
                    </option>

                    <option value="antigos">
                        Mais antigos
                    </option>

                    <option value="maior">
                        Maior valor
                    </option>

                    <option value="menor">
                        Menor valor
                    </option>

                </select>

            </div>

            <div id="listaMovimentacoes">

            </div>

        </div>

    </section>

    <!-- ========================= -->
    <!-- CATEGORIAS -->
    <!-- ========================= -->

    <section
        id="categorias"
        class="pagina">

        <div class="container">

            <div class="topo-categoria">

                <h2>
                    Categorias
                </h2>

                <button
                    id="btnNovaCategoria"
                    class="btn-secundario">

                    <i class="bi bi-plus-circle-fill"></i>

                    Nova Categoria

                </button>

            </div>

            <div class="categoria-box glass-card">

                <h3>
                    Categorias de Entrada
                </h3>

                <div id="categoriasEntrada">

                </div>

            </div>

            <div class="categoria-box glass-card">

                <h3>
                    Categorias de Saída
                </h3>

                <div id="categoriasSaida">

                </div>

            </div>

        </div>

    </section>

    <!-- ========================= -->
    <!-- AJUSTES -->
    <!-- ========================= -->

    <section
        id="ajustes"
        class="pagina">

        <div class="container">

            <h2>
                Ajustes
            </h2>

            <div class="ajustes-lista">

                <button id="btnExportar">

                    <i class="bi bi-download"></i>

                    Exportar Dados

                </button>

                <button id="btnImportar">

                    <i class="bi bi-upload"></i>

                    Importar Dados

                </button>

                <button
                    id="btnLimparDados"
                    class="btn-danger">

                    <i class="bi bi-trash-fill"></i>

                    Limpar Dados

                </button>

                <button>

                    <i class="bi bi-info-circle-fill"></i>

                    Sobre

                </button>

            </div>

        </div>

    </section>

    <!-- ========================= -->
    <!-- MODAL LANÇAMENTO -->
    <!-- ========================= -->

    <div
        id="modalLancamento"
        class="modal oculto">

        <div class="modal-content glass-modal">

            <h2 id="tituloModal">

                Novo Lançamento

            </h2>

            <form id="formLancamento">

                <input
                    type="date"
                    id="data"
                    required>

                <input
                    type="text"
                    id="descricao"
                    placeholder="Descrição"
                    required>

                <select
                    id="categoria"
                    required>

                </select>

                <input
                    type="number"
                    id="valor"
                    step="0.01"
                    placeholder="Valor"
                    required>

                <div class="modal-botoes">

                    <button
                        type="submit"
                        class="btn-primary">

                        Salvar

                    </button>

                    <button
                        type="button"
                        class="btn-cancelar"
                        onclick="fecharModalLancamento()">

                        Cancelar

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ========================= -->
    <!-- MODAL CATEGORIA -->
    <!-- ========================= -->

    <div
        id="modalCategoria"
        class="modal oculto">

        <div class="modal-content glass-modal">

            <h2>
                Categoria
            </h2>

            <form id="formCategoria">

                <select
                    id="tipoCategoria"
                    required>

                    <option value="entrada">
                        Entrada
                    </option>

                    <option value="saida">
                        Saída
                    </option>

                </select>

                <input
                    type="text"
                    id="nomeCategoria"
                    placeholder="Nome da categoria"
                    required>

                <div class="modal-botoes">

                    <button
                        type="submit"
                        class="btn-primary">

                        Salvar

                    </button>

                    <button
                        type="button"
                        class="btn-cancelar"
                        onclick="fecharModalCategoria()">

                        Cancelar

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ========================= -->
    <!-- MODAL CONFIRMAÇÃO -->
    <!-- ========================= -->

    <div
        id="modalConfirmacao"
        class="modal oculto">

        <div class="modal-content glass-modal">

            <h2>
                Confirmar
            </h2>

            <p id="textoConfirmacao">

                Deseja realmente excluir?

            </p>

            <div class="modal-botoes">

                <button
                    type="button"
                    class="btn-cancelar"
                    onclick="fecharConfirmacao()">

                    Cancelar

                </button>

                <button
                    id="btnConfirmarExclusao"
                    type="button"
                    class="btn-danger">

                    Excluir

                </button>

            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- MODAL MOVIMENTAÇÃO -->
    <!-- ========================= -->

    <div
        id="modalMovimentacao"
        class="modal oculto">

        <div class="modal-content glass-modal">

            <h2>
                Movimentação
            </h2>

            <div class="modal-botoes">

                <button
                    id="btnEditarMovimento"
                    class="btn-primary">

                    Editar

                </button>

                <button
                    id="btnExcluirMovimento"
                    class="btn-danger">

                    Excluir

                </button>

            </div>

            <button
                style="margin-top:10px;width:100%;"
                class="btn-cancelar"
                onclick="fecharModalMovimentacao()">

                Cancelar

            </button>

        </div>

    </div>

    <!-- ========================= -->
    <!-- NAVEGAÇÃO -->
    <!-- ========================= -->

    <nav class="bottom-nav">

        <button
            class="nav-item ativo"
            data-tela="inicio">

            <i class="bi bi-house-fill"></i>

            <span>Início</span>

        </button>

        <button
            class="nav-item"
            data-tela="movimentacoes">

            <i class="bi bi-arrow-left-right"></i>

            <span>Movimentos</span>

        </button>

        <button
            class="nav-item"
            data-tela="categorias">

            <i class="bi bi-tags-fill"></i>

            <span>Categorias</span>

        </button>

        <button
            class="nav-item"
            data-tela="ajustes">

            <i class="bi bi-gear-fill"></i>

            <span>Ajustes</span>

        </button>

    </nav>

    <script src="app.js"></script>

</body>

</html>
