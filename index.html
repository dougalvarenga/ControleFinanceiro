<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle Financeiro</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- CARD SALDO -->

        <div class="saldo-card">

            <div class="topo-card">

                <h3>Saldo</h3>

                <button class="btn-icon">
                    <i class="bi bi-gear-fill"></i>
                </button>

            </div>

            <h1 id="saldo">R$ 0,00</h1>

            <div class="resumo">

                <div class="card-resumo">

                    <span>Entradas</span>

                    <strong id="totalEntradas"
                        class="texto-verde">
                        R$ 0,00
                    </strong>

                </div>

                <div class="card-resumo">

                    <span>Saídas</span>

                    <strong id="totalSaidas"
                        class="texto-vermelho">
                        R$ 0,00
                    </strong>

                </div>

            </div>

        </div>

        <!-- AÇÕES -->

        <div class="acoes">

            <button id="btnEntrada" class="entrada-btn">

                <i class="bi bi-plus-circle-fill"></i>
                Entrada

            </button>

            <button id="btnSaida" class="saida-btn">

                <i class="bi bi-dash-circle-fill"></i>
                Saída

            </button>

        </div>

        <!-- FILTROS -->

        <div class="filtros">

            <input
                type="text"
                placeholder="Pesquisar..."
                id="pesquisa">

            <select id="categoriaFiltro">

                <option>
                    Todas as Categorias
                </option>

            </select>

            <select id="ordenacao">

                <option value="recentes">
                    Mais recentes
                </option>

                <option value="antigos">
                    Mais antigos
                </option>

            </select>

        </div>

        <!-- HISTÓRICO -->

        <h2 class="titulo">
            Histórico
        </h2>

        <div id="historico">
        </div>

    </div>

    <!-- NAVEGAÇÃO -->

    <nav class="bottom-nav">

        <button class="nav-item ativo">

            <i class="bi bi-house-fill"></i>

            <span>Início</span>

        </button>

        <button class="nav-item">

            <i class="bi bi-tags-fill"></i>

            <span>Categorias</span>

        </button>

        <button class="nav-item">

            <i class="bi bi-arrow-down-up"></i>

            <span>Movimentos</span>

        </button>

        <button class="nav-item">

            <i class="bi bi-gear-fill"></i>

            <span>Ajustes</span>

        </button>

    </nav>

    <script src="app.js"></script>

</body>

</html>
