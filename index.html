<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle Financeiro</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===================== -->
    <!-- TELA INÍCIO -->
    <!-- ===================== -->

    <section id="inicio" class="pagina ativa">

        <div class="container">

            <div class="saldo-card">

                <div class="topo-card">

                    <h3>Saldo</h3>

                    <button
                        class="btn-icon"
                        id="btnAbrirAjustes">

                        <i class="bi bi-gear-fill"></i>

                    </button>

                </div>

                <h1 id="saldo">
                    R$ 0,00
                </h1>

                <div class="resumo">

                    <div class="card-resumo">

                        <span>Entradas</span>

                        <strong
                            id="totalEntradas"
                            class="texto-verde">

                            R$ 0,00

                        </strong>

                    </div>

                    <div class="card-resumo">

                        <span>Saídas</span>

                        <strong
                            id="totalSaidas"
                            class="texto-vermelho">

                            R$ 0,00

                        </strong>

                    </div>

                </div>

            </div>

            <div class="acoes">

                <button
                    id="btnEntrada"
                    class="entrada-btn">

                    <i class="bi bi-plus-circle-fill"></i>

                    Entrada

                </button>

                <button
                    id="btnSaida"
                    class="saida-btn">

                    <i class="bi bi-dash-circle-fill"></i>

                    Saída

                </button>

            </div>

            <div class="bloco">

                <div class="secao-titulo">

                    <h2>
                        Últimos Lançamentos
                    </h2>

                </div>

                <div id="ultimosLancamentos">

                </div>

            </div>

        </div>

    </section>

    <!-- ===================== -->
    <!-- TELA MOVIMENTAÇÕES -->
    <!-- ===================== -->

    <section
        id="movimentacoes"
        class="pagina">

        <div class="container">

            <h2 class="titulo-pagina">

                Movimentações

            </h2>

            <div class="filtros">

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar..." />

                <select id="filtroCategoria">

                    <option value="">
                        Todas as Categorias
                    </option>

                </select>

                <select id="ordenacao">

                    <option value="recentes">
                        Mais recentes
                    </option>

                    <option value="antigos">
                        Mais antigos
                    </option>

                    <option value="maior">
                        Maior valor
                    </option>

                    <option value="menor">
                        Menor valor
                    </option>

                </select>

            </div>

            <div id="listaMovimentacoes">

            </div>

        </div>

    </section>

    <!-- ===================== -->
    <!-- TELA CATEGORIAS -->
    <!-- ===================== -->

    <section
        id="categorias"
        class="pagina">

        <div class="container">

            <div class="topo-categoria">

                <h2>
                    Categorias
                </h2>

                <button
                    id="btnNovaCategoria"
                    class="btn-secundario">

                    Nova Categoria

                </button>

            </div>

            <div class="categoria-box">

                <h3>
                    Entradas
                </h3>

                <div id="categoriasEntrada">

                </div>

            </div>

            <div class="categoria-box">

                <h3>
                    Saídas
                </h3>

                <div id="categoriasSaida">

                </div>

            </div>

        </div>

    </section>

    <!-- ===================== -->
    <!-- TELA AJUSTES -->
    <!-- ===================== -->

    <section
        id="ajustes"
        class="pagina">

        <div class="container">

            <h2>
                Ajustes
            </h2>

            <div class="ajustes-lista">

                <button id="btnExportar">

                    Exportar Dados

                </button>

                <button id="btnImportar">

                    Importar Dados

                </button>

                <button
                    id="btnLimparDados"
                    class="btn-danger">

                    Limpar Dados

                </button>

                <button>

                    Sobre

                </button>

            </div>

        </div>

    </section>

    <!-- ===================== -->
    <!-- MODAL LANÇAMENTO -->
    <!-- ===================== -->

    <div
        id="modalLancamento"
        class="modal oculto">

        <div class="modal-content">

            <h2 id="tituloModal">

                Novo Lançamento

            </h2>

            <form id="formLancamento">

                <input
                    type="date"
                    id="data"
                    required>

                <input
                    type="text"
                    id="descricao"
                    placeholder="Descrição"
                    required>

                <select
                    id="categoria"
                    required>

                </select>

                <input
                    type="number"
                    step="0.01"
                    id="valor"
                    placeholder="Valor"
                    required>

                <div class="modal-botoes">

                    <button
                        type="submit"
                        class="btn-primary">

                        Salvar

                    </button>

                    <button
                        type="button"
                        class="btn-cancelar"
                        onclick="fecharModalLancamento()">

                        Cancelar

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ===================== -->
    <!-- MODAL CATEGORIA -->
    <!-- ===================== -->

    <div
        id="modalCategoria"
        class="modal oculto">

        <div class="modal-content">

            <h2>

                Nova Categoria

            </h2>

            <form id="formCategoria">

                <select
                    id="tipoCategoria"
                    required>

                    <option value="entrada">

                        Entrada

                    </option>

                    <option value="saida">

                        Saída

                    </option>

                </select>

                <input
                    type="text"
                    id="nomeCategoria"
                    placeholder="Nome da categoria"
                    required>

                <div class="modal-botoes">

                    <button
                        type="submit"
                        class="btn-primary">

                        Salvar

                    </button>

                    <button
                        type="button"
                        class="btn-cancelar"
                        onclick="fecharModalCategoria()">

                        Cancelar

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ===================== -->
    <!-- NAVBAR LIQUID GLASS -->
    <!-- ===================== -->

    <nav class="bottom-nav">

        <button
            class="nav-item ativo"
            data-tela="inicio">

            <i class="bi bi-house-fill"></i>

            <span>Início</span>

        </button>

        <button
            class="nav-item"
            data-tela="movimentacoes">

            <i class="bi bi-arrow-left-right"></i>

            <span>Movimentos</span>

        </button>

        <button
            class="nav-item"
            data-tela="categorias">

            <i class="bi bi-tags-fill"></i>

            <span>Categorias</span>

        </button>

        <button
            class="nav-item"
            data-tela="ajustes">

            <i class="bi bi-gear-fill"></i>

            <span>Ajustes</span>

        </button>

    </nav>

    <script src="app.js"></script>

</body>

</html>
